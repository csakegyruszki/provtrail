[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "provtrail"
version = "0.2.4"
description = "Source provenance ledger for LLM-assisted research."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "provtrail contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/csakegyruszki/provtrail"
Repository = "https://github.com/csakegyruszki/provtrail"
Issues = "https://github.com/csakegyruszki/provtrail/issues"
Changelog = "https://github.com/csakegyruszki/provtrail/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
provtrail = "provtrail.cli:main"
provtrail-stop-hook = "provtrail.stop_hook:main"
provtrail-mcp = "provtrail.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
