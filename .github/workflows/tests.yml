name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . -w dist --no-deps
      - name: Install wheel into a fresh venv and smoke-test the CLI
        run: |
          python -m venv smoke-venv
          if [ -f smoke-venv/bin/python ]; then
            VENV_BIN=smoke-venv/bin
          else
            VENV_BIN=smoke-venv/Scripts
          fi
          "$VENV_BIN/python" -m pip install --upgrade pip
          "$VENV_BIN/python" -m pip install dist/*.whl
          $VENV_BIN/provtrail --help
          TMP_LEDGER="${RUNNER_TEMP}/l.jsonl"
          $VENV_BIN/provtrail add "$TMP_LEDGER" --url https://example.com
          $VENV_BIN/provtrail verify "$TMP_LEDGER"
          $VENV_BIN/provtrail head "$TMP_LEDGER"

  test-with-mcp-extra:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with the mcp extra
        run: pip install ".[mcp]" jsonschema
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . -w dist --no-deps
      - name: Install wheel into a fresh venv and smoke-test the CLI
        run: |
          python -m venv smoke-venv
          if [ -f smoke-venv/bin/python ]; then
            VENV_BIN=smoke-venv/bin
          else
            VENV_BIN=smoke-venv/Scripts
          fi
          "$VENV_BIN/python" -m pip install --upgrade pip
          "$VENV_BIN/python" -m pip install dist/*.whl
          $VENV_BIN/provtrail --help
          TMP_LEDGER="${RUNNER_TEMP}/l.jsonl"
          $VENV_BIN/provtrail add "$TMP_LEDGER" --url https://example.com
          $VENV_BIN/provtrail verify "$TMP_LEDGER"
          $VENV_BIN/provtrail head "$TMP_LEDGER"
